<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#F1F5FB; --panel:#E6EDF7; --panel-2:#D5E1F0;
  --grid:rgba(0,33,74,.055);
  --ink:#00214A; --ink-2:#46587A; --ink-3:#8496B0;
  --rule:#CBD7E7;
  --accent:#FF1100; --accent-ink:#C21000; --accent-soft:#FFE7E3;
  --green:#0B6B4F; --green-soft:#DDF0E8;
  --purple:#5B21B6; --purple-soft:#EDE9FE;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061530; --panel:#0E2249; --panel-2:#16305A;
    --grid:rgba(232,238,247,.05);
    --ink:#E9EFF8; --ink-2:#A2B4CE; --ink-3:#70859F;
    --rule:#1E3A63;
    --accent:#FF3B26; --accent-ink:#FF7563; --accent-soft:#3B140F;
    --green:#7FD3B2; --green-soft:#0F2E26;
    --purple:#A78BFA; --purple-soft:#2E1065;
  }
}
:root[data-theme="dark"]{
  --bg:#061530; --panel:#0E2249; --panel-2:#16305A;
  --grid:rgba(232,238,247,.05);
  --ink:#E9EFF8; --ink-2:#A2B4CE; --ink-3:#70859F;
  --rule:#1E3A63;
  --accent:#FF3B26; --accent-ink:#FF7563; --accent-soft:#3B140F;
  --green:#7FD3B2; --green-soft:#0F2E26;
  --purple:#A78BFA; --purple-soft:#2E1065;
}

*{box-sizing:border-box}
* {scrollbar-width:thin; scrollbar-color:var(--rule) transparent}
::-webkit-scrollbar{width:9px; height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule); border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}

body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,sans-serif;
  background-image:
    repeating-linear-gradient(to right, var(--grid) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(to bottom, var(--grid) 0 1px, transparent 1px 28px);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Manrope",system-ui,sans-serif; text-wrap:balance; margin:0; font-weight:800; letter-spacing:-.01em}
p{margin:0}

.deck{height:100vh; display:flex; flex-direction:column}
.stage{flex:1 1 auto; position:relative; overflow:hidden}
.slide{
  position:absolute; inset:0; padding:clamp(20px,4vw,50px) clamp(24px,5vw,70px);
  display:none; flex-direction:column; justify-content:center; gap:clamp(14px,2vh,24px);
  max-width:1300px; margin:0 auto; width:100%; overflow-y:auto;
}
.slide.is-on{display:flex}

.title-slide h1{
  font-size:clamp(28px,4.5vw,50px); line-height:1.08; letter-spacing:-.02em;
  background:linear-gradient(135deg, var(--ink) 30%, var(--accent-ink));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.title-slide .lede{font-size:clamp(15px,1.6vw,20px); color:var(--ink-2); max-width:85ch; line-height:1.45}
.title-meta{
  display:inline-flex; gap:16px; flex-wrap:wrap;
  font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink-3);
  padding:6px 12px; background:var(--panel); border-radius:6px; border:1px solid var(--rule); width:fit-content;
}
.eyebrow{
  font-family:"JetBrains Mono",monospace; font-size:clamp(11px,1.1vw,13px);
  text-transform:uppercase; letter-spacing:.08em; color:var(--accent); font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.eyebrow::before{content:""; display:inline-block; width:8px; height:8px; background:var(--accent); border-radius:50%}

h2{font-size:clamp(22px,2.8vw,34px); line-height:1.15; color:var(--ink)}

.cols{display:grid; gap:clamp(12px,1.8vw,22px); align-items:stretch}
.cols.c2{grid-template-columns:repeat(2, minmax(0,1fr))}
.cols.c3{grid-template-columns:repeat(3, minmax(0,1fr))}
.cols.c4{grid-template-columns:repeat(4, minmax(0,1fr))}

.box{
  background:var(--panel); border:1px solid var(--rule); border-radius:10px;
  padding:clamp(14px,1.6vw,22px); display:flex; flex-direction:column; gap:10px;
  box-shadow:0 4px 16px rgba(0,20,50,.03);
}
.box.accent{border-left:4px solid var(--accent); background:linear-gradient(180deg, var(--accent-soft) 0%, var(--panel) 25%)}
.box.green{border-left:4px solid var(--green); background:linear-gradient(180deg, var(--green-soft) 0%, var(--panel) 25%)}
.box.purple{border-left:4px solid var(--purple); background:linear-gradient(180deg, var(--purple-soft) 0%, var(--panel) 25%)}

.box h3{font-size:clamp(15px,1.3vw,18px); display:flex; align-items:center; gap:8px}
.box p{font-size:clamp(13px,1.1vw,15px); color:var(--ink-2); line-height:1.45}

code, pre, .mono{font-family:"JetBrains Mono",monospace}
pre.code-block{
  background:var(--panel-2); border:1px solid var(--rule); border-radius:6px;
  padding:12px; margin:0; font-size:clamp(11px,0.95vw,13px); line-height:1.4; color:var(--ink);
  overflow-x:auto; white-space:pre-wrap;
}
.tag{
  display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:700;
  font-family:"JetBrains Mono",monospace; text-transform:uppercase; letter-spacing:.04em;
}
.tag.red{background:var(--accent-soft); color:var(--accent-ink)}
.tag.green{background:var(--green-soft); color:var(--green)}
.tag.purple{background:var(--purple-soft); color:var(--purple)}

ul.plain{margin:0; padding:0; list-style:none; display:grid; gap:8px}
ul.plain li{
  display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:baseline;
  font-size:clamp(13px,1.05vw,15px); line-height:1.4; color:var(--ink-2);
}
ul.plain li::before{content:"→"; color:var(--accent); font-weight:700; font-family:"JetBrains Mono",monospace}

.step-card{
  background:var(--panel); border:1px solid var(--rule); border-radius:8px;
  padding:14px; display:flex; flex-direction:column; gap:8px; position:relative;
}
.step-num{
  width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--bg);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  font-family:"JetBrains Mono",monospace;
}

/* Brandmark logo styling */
.brandmark{display:block; line-height:0}
.brandmark img{display:block; width:100%; height:auto}
.brandmark.bar-mark{width:110px}

/* BAR CONTROLS */
.bar{
  flex:0 0 auto; height:52px; background:var(--panel); border-top:1px solid var(--rule);
  display:flex; align-items:center; justify-content:space-between; padding:0 clamp(12px,2vw,24px);
  gap:12px; font-family:"JetBrains Mono",monospace; font-size:12px; position:relative; z-index:10;
}
.bar-left, .bar-right{display:flex; align-items:center; gap:12px}
.bar-mark{height:26px; width:auto; opacity:.85; filter:grayscale(20%)}
.phase{
  padding:4px 10px; background:var(--panel-2); border:1px solid var(--rule); border-radius:4px;
  font-size:11px; font-weight:700; color:var(--ink); letter-spacing:.04em;
}
.count{color:var(--ink-3); font-variant-numeric:tabular-nums}
.clock{color:var(--ink-2); font-weight:700; background:var(--accent-soft); color:var(--accent-ink); padding:3px 8px; border-radius:4px}

.dots{display:flex; gap:6px}
.dot{
  width:8px; height:8px; border-radius:50%; background:var(--rule); border:none; padding:0;
  cursor:pointer; transition:all .15s ease;
}
.dot:hover{background:var(--ink-2)}
.dot.is-on{background:var(--accent); width:20px; border-radius:4px}

.bar-controls{display:flex; align-items:center; gap:6px}
button.navbtn{
  height:32px; padding:0 12px; background:var(--panel-2); border:1px solid var(--rule);
  color:var(--ink); border-radius:4px; cursor:pointer; font-family:inherit; font-size:12px;
  font-weight:700; display:inline-flex; align-items:center; justify-content:center; transition:all .15s;
}
button.navbtn:hover{background:var(--ink); color:var(--bg)}
.langs{display:inline-flex; border:1px solid var(--rule); border-radius:4px; overflow:hidden}
.langs button.lg{
  height:30px; padding:0 9px; background:var(--panel-2); border:none; color:var(--ink-2);
  cursor:pointer; font-family:inherit; font-size:11px; font-weight:700; transition:all .15s;
}
.langs button.lg.is-on{background:var(--ink); color:var(--bg)}
.theme-btn{min-width:76px}

/* PROGRESS BAR */
.progress-wrap{height:3px; background:var(--rule); position:absolute; top:0; left:0; right:0}
.progress-bar{height:100%; background:var(--accent); width:8.33%; transition:width .2s ease}

/* SPEAKER NOTES */
.notes{
  position:fixed; bottom:52px; right:16px; width:min(540px, calc(100vw - 32px));
  max-height:65vh; background:var(--panel); border:2px solid var(--rule); border-radius:8px;
  box-shadow:0 16px 40px rgba(0,20,50,.2); padding:16px; display:grid; gap:12px;
  z-index:999; font-size:13px; line-height:1.45; overflow-y:auto;
}
.notes[hidden]{display:none !important}
.notes-header{display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--rule); padding-bottom:8px}
.notes-header b{font-family:"Manrope",sans-serif; color:var(--accent-ink); font-size:14px}
.notes-close{border:none; background:none; font-size:18px; cursor:pointer; color:var(--ink-3)}
.notes-say{background:var(--panel-2); border-left:3px solid var(--accent); padding:10px 12px; border-radius:4px; font-style:italic; color:var(--ink)}
.notes-do{color:var(--ink-2); font-size:12px; font-family:"JetBrains Mono",monospace}

.deck.is-clean .bar{display:none !important}
.bar-restore-btn {
  display: none;
  position: fixed;
  bottom: 12px;
  right: 16px;
  z-index: 9999;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--rule);
  border-radius: 99px;
  padding: 6px 14px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
  font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  cursor: pointer;
  opacity: 0.9;
  transition: all 0.2s ease;
}
.bar-restore-btn:hover, .bar-restore-btn:active {
  opacity: 1;
  transform: translateY(-2px);
  border-color: var(--accent);
  color: var(--accent-ink);
}
.deck.is-clean .bar-restore-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>
<body>

<div class="deck">
<div class="brandrule"></div>
<div class="stage">
