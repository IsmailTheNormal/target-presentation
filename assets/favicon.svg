<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <style>
    :root { --navy: #00214A; --red: #FF1100; }
    @media (prefers-color-scheme: dark) {
      :root { --navy: #FFFFFF; --red: #FF3B26; }
    }
    .navy-fill { fill: var(--navy); }
    .navy-stroke { stroke: var(--navy); fill: none; }
    .red-fill { fill: var(--red); }
    .red-stroke { stroke: var(--red); fill: none; }
  </style>
  <!-- Outer 4 Navy Quadrants -->
  <path class="navy-stroke" stroke-width="11.5" stroke-linecap="butt"
        d="M 54.5 7.9 A 40.5 40.5 0 0 1 88.1 41.5 M 88.1 54.5 A 40.5 40.5 0 0 1 54.5 88.1 M 41.5 88.1 A 40.5 40.5 0 0 1 7.9 54.5 M 7.9 41.5 A 40.5 40.5 0 0 1 41.5 7.9" />
  <!-- Inner Red Target Ring -->
  <circle class="red-stroke" cx="48" cy="48" r="17.2" stroke-width="7.2" />
  <!-- Red Crosshairs -->
  <rect class="red-fill" x="45.6" y="3" width="4.8" height="28" rx="0.5" />
  <rect class="red-fill" x="45.6" y="65" width="4.8" height="28" rx="0.5" />
  <rect class="red-fill" x="3" y="45.6" width="28" height="4.8" rx="0.5" />
  <rect class="red-fill" x="65" y="45.6" width="28" height="4.8" rx="0.5" />
  <!-- Center Bullseye Navy Dot -->
  <circle class="navy-fill" cx="48" cy="48" r="7.2" />
</svg>