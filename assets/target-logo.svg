<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 177" width="738" height="177">
  <style>
    .brand-navy { fill: var(--ink, #00214A); }
    .brand-navy-stroke { stroke: var(--ink, #00214A); fill: none; }
    .brand-red { fill: var(--accent, #FF1100); }
    .brand-red-stroke { stroke: var(--accent, #FF1100); fill: none; }
  </style>
  <g transform="translate(8, 7) scale(1.70)">
    <!-- Outer 4 Quadrants -->
    <path class="brand-navy-stroke" stroke-width="11.5" stroke-linecap="butt"
          d="M 54.5 7.9 A 40.5 40.5 0 0 1 88.1 41.5 M 88.1 54.5 A 40.5 40.5 0 0 1 54.5 88.1 M 41.5 88.1 A 40.5 40.5 0 0 1 7.9 54.5 M 7.9 41.5 A 40.5 40.5 0 0 1 41.5 7.9" />
    <!-- Inner Red Target Ring -->
    <circle class="brand-red-stroke" cx="48" cy="48" r="17.2" stroke-width="7.2" />
    <!-- Red Crosshairs -->
    <rect class="brand-red" x="45.6" y="3" width="4.8" height="28" rx="0.5" />
    <rect class="brand-red" x="45.6" y="65" width="4.8" height="28" rx="0.5" />
    <rect class="brand-red" x="3" y="45.6" width="28" height="4.8" rx="0.5" />
    <rect class="brand-red" x="65" y="45.6" width="28" height="4.8" rx="0.5" />
    <!-- Center Dot -->
    <circle class="brand-navy" cx="48" cy="48" r="7.2" />
  </g>
  <!-- TARGET Text -->
  <text x="198" y="106" font-family="'Manrope', system-ui, sans-serif" font-weight="900" font-size="96" letter-spacing="-0.5">
    <tspan class="brand-navy">T</tspan><tspan class="brand-red">A</tspan><tspan class="brand-navy">RGET</tspan>
  </text>
  <!-- INTERNATIONAL SCHOOL Text -->
  <text x="202" y="150" font-family="'Source Sans 3', system-ui, sans-serif" font-weight="700" font-size="24" letter-spacing="7.5" class="brand-navy">INTERNATIONAL SCHOOL</text>
</svg>