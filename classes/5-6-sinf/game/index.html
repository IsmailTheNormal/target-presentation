<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Runner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div class="hud-item">
          <span class="label">Счёт</span>
          <strong id="score">0</strong>
        </div>
        <div class="hud-item">
          <span class="label">Жизни</span>
          <strong id="lives">3</strong>
        </div>
        <div class="hud-item">
          <span class="label">Рекорд</span>
          <strong id="highScore">0</strong>
        </div>
      </header>

      <canvas id="gameCanvas" width="900" height="600" aria-label="Игра"></canvas>

      <div id="overlay" class="overlay visible">
        <div class="panel">
          <h1>Star Runner</h1>
          <p>Управление: стрелки влево/вправо или A/D</p>
          <p>Собирай звёзды, избегай астероидов</p>
          <button id="startBtn">Играть</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
