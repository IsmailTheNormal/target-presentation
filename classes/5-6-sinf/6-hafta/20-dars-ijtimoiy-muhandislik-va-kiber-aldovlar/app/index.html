<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Shield — Mening Kiber-Detektor Veb-Ilovam</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Cstyle%3E:root%7B--n:%2300214A;--r:%23FF1100%7D@media(prefers-color-scheme:dark)%7B:root%7B--n:%23FFFFFF;--r:%23FF3B26%7D%7D.nf%7Bfill:var(--n)%7D.ns%7Bstroke:var(--n);fill:none%7D.rf%7Bfill:var(--r)%7D.rs%7Bstroke:var(--r);fill:none%7D%3C/style%3E%3Cpath class='ns' stroke-width='11.5' d='M54.5 7.9A40.5 40.5 0 0 1 88.1 41.5M88.1 54.5A40.5 40.5 0 0 1 54.5 88.1M41.5 88.1A40.5 40.5 0 0 1 7.9 54.5M7.9 41.5A40.5 40.5 0 0 1 41.5 7.9'/%3E%3Ccircle class='rs' cx='48' cy='48' r='17.2' stroke-width='7.2'/%3E%3Crect class='rf' x='45.6' y='3' width='4.8' height='28' rx='.5'/%3E%3Crect class='rf' x='45.6' y='65' width='4.8' height='28' rx='.5'/%3E%3Crect class='rf' x='3' y='45.6' width='28' height='4.8' rx='.5'/%3E%3Crect class='rf' x='65' y='45.6' width='28' height='4.8' rx='.5'/%3E%3Ccircle class='nf' cx='48' cy='48' r='7.2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<style>
/* 1-QADAM: RANG VA TEMA SOZLAMALARI (CSS) */
:root {
  --bg: #07152B;
  --panel: #0D2245;
  --panel-2: #143160;
  --border: #1E427B;
  --text: #FFFFFF;
  --text-muted: #9CB4D8;
  --danger: #FF3B26;
  --safe: #10B981;
  --accent: #3B82F6;
  --radius: 12px;
}

:root[data-theme="light"] {
  --bg: #F1F5FB;
  --panel: #FFFFFF;
  --panel-2: #E6EDF7;
  --border: #CBD7E7;
  --text: #00214A;
  --text-muted: #46587A;
  --danger: #FF1100;
  --safe: #059669;
  --accent: #2563EB;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: 'Source Sans 3', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* 2-QADAM: ASOSIY KARTA VA KONTEYNER */
.app-container {
  max-width: 680px;
  width: 100%;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 20px;
}

.theme-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

/* 3-QADAM: MATN KIRITISH MAYDONI */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

label.input-label {
  font-weight: 700;
  font-size: 14px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

textarea.chat-input {
  width: 100%;
  height: 110px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-family: 'Source Sans 3', sans-serif;
  font-size: 15px;
  color: var(--text);
  resize: vertical;
  outline: none;
  transition: border-color 0.2s ease;
}

textarea.chat-input:focus {
  border-color: var(--accent);
}

/* TUGMALAR GURUHI */
.btn-group {
  display: flex;
  gap: 10px;
}

button.check-btn {
  flex: 1;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 8px;
  font-family: 'Manrope', sans-serif;
  font-weight: 800;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
}

button.check-btn:hover {
  opacity: 0.92;
  transform: translateY(-2px);
}

button.quick-sample-btn {
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}

/* 4-QADAM: NATIJA QALQONI */
.result-shield {
  display: none;
  padding: 20px;
  border-radius: 10px;
  border: 2px solid var(--border);
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-shield.danger {
  display: block;
  background: rgba(255, 59, 38, 0.12);
  border-color: var(--danger);
  color: var(--danger);
}

.result-shield.safe {
  display: block;
  background: rgba(16, 185, 129, 0.12);
  border-color: var(--safe);
  color: var(--safe);
}

.result-title {
  font-family: 'Manrope', sans-serif;
  font-size: 18px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.result-desc {
  font-size: 14.5px;
  color: var(--text);
  line-height: 1.5;
}

.flags-list {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.flag-badge {
  background: var(--danger);
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
}

/* SOZLAMALAR: XAVFLI SO'ZLAR RO'YXATI */
.custom-words-section {
  border-top: 1px solid var(--border);
  padding-top: 14px;
  font-size: 13px;
  color: var(--text-muted);
}
.words-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.word-pill {
  background: var(--panel-2);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: 99px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="app-container">
  <!-- Sarlavha -->
  <header class="app-header">
    <div class="brand-title">
      <span>🛡️</span>
      <span data-ru="Cyber Shield: Детектор Обманов" data-en="Cyber Shield: Scam Detector">Cyber Shield: Kiber-Qalqon</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="theme-btn" onclick="toggleTheme()" data-ru="Тема" data-en="Theme">Mavzu</button>
      <button class="theme-btn" id="langBtn" onclick="toggleLang()">UZ</button>
    </div>
  </header>

  <!-- Matn kiritish -->
  <div class="input-group">
    <label class="input-label" data-ru="Вставьте подозрительное сообщение из чата:" data-en="Paste suspicious chat message:">Shubhali xabarni shu yerga joylang:</label>
    <textarea class="chat-input" id="messageInput" placeholder="Masalan: Salom, 10,000 Robux yutib oldingiz, tezda parolingizni yozing..."></textarea>
  </div>

  <!-- Tugmalar -->
  <div class="btn-group">
    <button class="check-btn" onclick="scanMessage()">
      <span>🔍</span>
      <span data-ru="Проверить на Мошенничество" data-en="Scan for Scams & Traps">Xavfni Skaner Qilish</span>
    </button>
    <button class="quick-sample-btn" onclick="insertSample()" data-ru="Пример Обмана" data-en="Insert Sample">Namuna Xabar</button>
  </div>

  <!-- Natija ekrani -->
  <div class="result-shield" id="resultCard">
    <div class="result-title" id="resultStatus"></div>
    <div class="result-desc" id="resultText"></div>
    <div class="flags-list" id="flagsBox"></div>
  </div>

  <!-- Shaxsiy sozlash: Xavfli so'zlar ro'yxati -->
  <div class="custom-words-section">
    <div data-ru="База опасных слов детектора (можно добавить свои в коде!):" data-en="Detector's dangerous word dictionary (add yours in code!):">Detektor qidiradigan xavfli so'zlar bazasi:</div>
    <div class="words-cloud" id="wordsCloud">
      <!-- Words rendered via JS -->
    </div>
  </div>
</div>

<script>
// 5-QADAM: DASTURNING AQLI (JAVASCRIPT)
var currentLang = 'uz';

// Kiber-Detektor qidiradigan xavfli so'zlar ro'yxati (Massiv / Array)
var DANGEROUS_WORDS = [
  "tekin", "bepul", "robux", "parol", "password", "kod", "sms",
  "login", "yutdingiz", "yutuq", "sovg'a", "bloklanadi", "tezroq",
  "5 daqiqa", "admin", "qutqar", "v-bucks", "gem"
];

function renderWordPills() {
  var cloud = document.getElementById('wordsCloud');
  cloud.innerHTML = '';
  DANGEROUS_WORDS.forEach(function(w) {
    var span = document.createElement('span');
    span.className = 'word-pill';
    span.textContent = w;
    cloud.appendChild(span);
  });
}

function scanMessage() {
  var input = document.getElementById('messageInput').value.toLowerCase().trim();
  var card = document.getElementById('resultCard');
  var statusTitle = document.getElementById('resultStatus');
  var desc = document.getElementById('resultText');
  var flagsBox = document.getElementById('flagsBox');

  if (!input) {
    alert(currentLang === 'ru' ? 'Сначала введите текст сообщения!' : currentLang === 'en' ? 'Please paste a message first!' : 'Iltimos, avval matn kiriting!');
    return;
  }

  // Xavfli so'zlarni qidirish
  var foundFlags = [];
  DANGEROUS_WORDS.forEach(function(word) {
    if (input.includes(word)) {
      foundFlags.push(word);
    }
  });

  flagsBox.innerHTML = '';

  if (foundFlags.length > 0) {
    // XAVF ANIQLANDI!
    card.className = 'result-shield danger';
    statusTitle.innerHTML = '🚨 ' + (currentLang === 'ru' ? 'ВНИМАНИЕ! ОБНАРУЖЕН ОБМАН!' : currentLang === 'en' ? 'WARNING! SCAM DETECTED!' : 'DIQQAT! KIBER-XAVF ANIQLANDI!');
    desc.innerHTML = (currentLang === 'ru' 
      ? 'В этом сообщении найдены психологические уловки мошенников. Ни в коем случае не называйте пароли и коды!' 
      : currentLang === 'en' 
      ? 'Scam red flags detected. Never share passwords or SMS verification codes!' 
      : 'Ushbu xabarda firibgarlar ishlatadigan tuzoqlar aniqlandi. Parol yoki tasdiqlash kodlarini mutlaqo bermang!');

    // Topilgan so'zlarni ekranga chiqarish
    foundFlags.forEach(function(flag) {
      var badge = document.createElement('span');
      badge.className = 'flag-badge';
      badge.textContent = '🚩 ' + flag;
      flagsBox.appendChild(badge);
    });
  } else {
    // XABAR TOZA VA XAVFSIZ!
    card.className = 'result-shield safe';
    statusTitle.innerHTML = '✅ ' + (currentLang === 'ru' ? 'СООБЩЕНИЕ БЕЗОПАСНО' : currentLang === 'en' ? 'MESSAGE IS CLEAN' : 'XABAR XAVFSIZ VA TOZA');
    desc.innerHTML = (currentLang === 'ru'
      ? 'Подозрительных ключевых слов не обнаружено. Но всегда оставайтесь бдительны!'
      : currentLang === 'en'
      ? 'No suspicious keywords found. Always stay vigilant online!'
      : 'Xabarda shubhali qizil bayroqlar topilmadi. Shunda ham doimo ehtiyot bo\'ling!');
  }
}

function insertSample() {
  document.getElementById('messageInput').value = 
    "Salom do'stim! Sening profiling 10,000 bepul Robux yutib oldi! Olish uchun 5 daqiqa ichida parolingni va SMS kodni aytvor!";
  scanMessage();
}

function toggleTheme() {
  var root = document.documentElement;
  var isDark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', isDark ? 'light' : 'dark');
}

function toggleLang() {
  var langs = ['uz', 'ru', 'en'];
  var nextIdx = (langs.indexOf(currentLang) + 1) % langs.length;
  currentLang = langs[nextIdx];
  document.getElementById('langBtn').textContent = currentLang.toUpperCase();
  document.querySelectorAll('[data-' + currentLang + ']').forEach(function(el) {
    el.textContent = el.getAttribute('data-' + currentLang);
  });
}

renderWordPills();
</script>
</body>
</html>
